# Solo para tests: límites holgados para que los tests de otras fases no choquen con el rate limiting.
# Los tests de fuerza bruta los sobrescriben con valores bajos en su propia anotación.
app.ratelimit.login-ip-per-minute=100000
app.ratelimit.login-account-per-15min=100000
app.ratelimit.register-ip-per-hour=100000
app.ratelimit.mail-ip-per-hour=100000
app.ratelimit.mail-account-per-hour=100000
app.ratelimit.token-ip-per-minute=100000

# Clave ficticia solo para tests (no es ningún secreto real).
TOTP_ENCRYPTION_KEY=clave-totp-solo-para-tests-0123456789-abcdef
