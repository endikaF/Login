<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · Tablero de notas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header><h1>Recuperar contraseña</h1></header>
  <main id="main">
    <section class="card" aria-labelledby="t">
      <h2 id="t">Te enviaremos un enlace</h2>
      <form id="form">
        <label for="email">Email de tu cuenta</label>
        <input id="email" type="email" autocomplete="username" required maxlength="254">
        <button type="submit">Enviar enlace</button>
      </form>
      <p id="msg" class="msg" aria-live="polite"></p>
      <p><a href="index.html">Volver al acceso</a></p>
    </section>
  </main>
