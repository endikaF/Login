<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ff6a1a">
  <title>Administración · Tablero de notas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111317'/%3E%3Ccircle cx='8' cy='7' r='1.6' fill='%23ff6a1a'/%3E%3Ccircle cx='16' cy='7' r='1.6' fill='%23ff6a1a'/%3E%3Ccircle cx='24' cy='7' r='1.6' fill='%23ff6a1a'/%3E%3Cpath d='M8 14h16M8 19h16M8 24h9' stroke='%23ff6a1a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="notes.html" aria-label="Tablero de notas, inicio">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><circle class="hole" cx="8" cy="7" r="1.6"/><circle class="hole" cx="16" cy="7" r="1.6"/><circle class="hole" cx="24" cy="7" r="1.6"/><path class="rule" d="M8 14h16M8 19h16M8 24h9"/></svg>
        <span>Tablero</span>
      </a>
      <nav class="tabs" aria-label="Principal">
        <a href="notes.html">Notas</a>
        <a href="security.html">Seguridad</a>
        <a id="admin-link" href="admin.html" aria-current="page">Administración</a>
      </nav>
      <details class="account">
        <summary aria-label="Menú de la cuenta"><span id="avatar" class="avatar" aria-hidden="true"></span><span id="who" class="who"></span></summary>
        <div class="account-panel">
          <button id="logout" type="button">Cerrar sesión</button>
          <button id="logout-all" type="button">Cerrar sesión en todos los dispositivos</button>
        </div>
      </details>
    </div>
  </header>

  <main id="main" class="page">
    <div class="page-head">
      <h1>Administración</h1>
      <p>Gestiona las cuentas: activa o desactiva el acceso, cambia roles y cierra sesiones.</p>
    </div>
    <p id="msg" class="msg" aria-live="polite"></p>

    <section class="sheet table-sheet" aria-labelledby="users-title">
      <h2 id="users-title">Usuarios</h2>
      <div class="table-wrap">
        <table>
          <caption>Cuentas registradas</caption>
          <thead>
            <tr><th scope="col">Email</th><th scope="col">Rol</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
