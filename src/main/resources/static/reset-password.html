<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · Tablero de notas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/reset.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header><h1>Nueva contraseña</h1></header>
  <main id="main">
    <section class="card" aria-labelledby="t">
      <h2 id="t">Elige una contraseña nueva</h2>
      <form id="form">
        <label for="password">Contraseña nueva</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"
               aria-describedby="hint">
        <p id="hint" class="hint">Entre 12 y 128 caracteres. Al cambiarla se cerrarán todas tus sesiones abiertas.</p>
        <button type="submit">Cambiar contraseña</button>
      </form>
      <p id="msg" class="msg" aria-live="polite"></p>
      <p><a href="index.html">Ir al acceso</a></p>
    </section>
  </main>
</body>
</html>
