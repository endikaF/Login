<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ff6a1a">
  <title>Nueva contraseña · Tablero de notas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111317'/%3E%3Ccircle cx='8' cy='7' r='1.6' fill='%23ff6a1a'/%3E%3Ccircle cx='16' cy='7' r='1.6' fill='%23ff6a1a'/%3E%3Ccircle cx='24' cy='7' r='1.6' fill='%23ff6a1a'/%3E%3Cpath d='M8 14h16M8 19h16M8 24h9' stroke='%23ff6a1a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/reset.js"></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="auth">
    <aside class="auth-cover compact">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><circle class="hole" cx="8" cy="7" r="1.6"/><circle class="hole" cx="16" cy="7" r="1.6"/><circle class="hole" cx="24" cy="7" r="1.6"/><path class="rule" d="M8 14h16M8 19h16M8 24h9"/></svg>
        <span>Tablero de notas</span>
      </a>
      <div>
        <h1>Una contraseña nueva.</h1>
        <p class="lede">Al cambiarla se cerrarán todas tus sesiones abiertas.</p>
      </div>
    </aside>

    <main id="main" class="auth-main">
      <div class="auth-panel">
        <section class="sheet" aria-labelledby="t">
          <h2 id="t">Elige una contraseña nueva</h2>
          <form id="form">
            <label for="password">Contraseña nueva</label>
            <input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"
                   aria-describedby="hint">
            <p id="hint" class="hint">Entre 12 y 128 caracteres. Una frase larga es mejor que una palabra con símbolos.</p>
            <button type="submit">Cambiar contraseña</button>
          </form>
          <p id="msg" class="msg" aria-live="polite"></p>
        </section>
        <a class="back-link" href="index.html">Ir al acceso</a>
      </div>
    </main>
  </div>
</body>
</html>
