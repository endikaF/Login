spring:
  application:
    name: login
  config:
    # Carga opcional de .env (formato CLAVE=valor) para desarrollo local; .env está en .gitignore.
    import: optional:file:.env[.properties]
  datasource:
    # foreign_keys=true: SQLite lo trae desactivado; el driver lo ejecuta (PRAGMA) en CADA conexión.
    # busy_timeout: espera hasta 5 s si otro escritor tiene el bloqueo, en vez de fallar al instante.
    # journal_mode=WAL: lecturas no bloquean al escritor único.
    url: jdbc:sqlite:data/app.db?foreign_keys=true&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite admite un solo escritor: con una única conexión no hay "database is locked" entre hilos.
      maximum-pool-size: 1
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  autoconfigure:
    # Evita que Spring cree un usuario "user" con contraseña aleatoria impresa en el log.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  # Base de los enlaces de los correos (en producción, la URL pública HTTPS).
  base-url: http://localhost:8080
  max-body-bytes: 65536            # tope de cuerpo de las peticiones a /api/** (64 KB)
  cors:
    # Orígenes EXTRA permitidos (lista separada por comas). Vacío = solo el propio origen (base-url).
    allowed-origins: ""
  tokens:
    verify-email-hours: 24
    reset-minutes: 20              # dentro del rango 15-30 min: un enlace robado caduca pronto
  jwt:
    # Vida corta: si un access token se roba, caduca pronto. No se puede revocar antes salvo con token_version.
    access-ttl-minutes: 10
  refresh:
    ttl-days: 7                    # caducidad deslizante de cada refresh token
    max-session-days: 30           # vida ABSOLUTA de una sesión: pasado este tiempo hay que volver a iniciar sesión
  ratelimit:
    # Límites en memoria (se pierden al reiniciar). Cada bucket se rellena de forma gradual.
    login-ip-per-minute: 20        # intentos de login por IP y minuto
    login-account-per-15min: 10    # intentos de login por cuenta (exista o no) cada 15 minutos
    register-ip-per-hour: 10       # registros por IP y hora (Argon2 es costoso en CPU/memoria)
    mail-ip-per-hour: 10           # peticiones de correo (recuperar/reenviar) por IP y hora
    mail-account-per-hour: 3       # correos por destinatario y hora (exista o no la cuenta)
    token-ip-per-minute: 20        # canjes de enlace (verificar/resetear) por IP y minuto
    max-tracked-keys: 10000       # tope de claves en memoria: evita agotar RAM con emails/IP inventados
  lockout:
    max-attempts: 5                # fallos seguidos que disparan el bloqueo de la cuenta
    base-minutes: 1                # 1.er bloqueo; se duplica en cada bloqueo sucesivo...
    max-minutes: 30                # ...hasta este tope
  cookie:
    # Secure: la cookie solo viaja por HTTPS. Los navegadores lo aceptan también en http://localhost.
    secure: true

server:
  # Solo localhost: no se abre el puerto a la red.
  address: 127.0.0.1
  port: 8080
  error:
    # Nunca exponer trazas ni mensajes internos en la página de error por defecto.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
